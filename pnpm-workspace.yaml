# Réglages de pnpm (pas de monorepo : un seul paquet).

# Une version publiée depuis moins de 24 h n'est pas installée :
# laisse le temps de repérer un paquet piégé.
minimumReleaseAge: 1440

# Seuls ces paquets peuvent lancer un script d'installation.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - supabase
  - workerd

# minimatch 10 a un déni de service par amplification de motifs (GHSA-g3hv-75wg-m249), corrigé
# seulement en 11.0.1. ESLint et typescript-eslint demandent encore ^10 : on les force à la 11.
# À retirer quand ils l'auront adoptée (`pnpm why minimatch` ne doit plus rien devoir à ceci).
overrides:
  'minimatch@^10': ^11.0.3
