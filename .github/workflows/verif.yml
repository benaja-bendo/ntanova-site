name: Vérification

on:
  pull_request:
  push:
    branches: [main]
  # Rappelé par la mise en ligne : rien ne part en ligne sans ces contrôles.
  workflow_call:

permissions:
  contents: read

# `github.workflow` : appelé par la mise en ligne, ce groupe porte son nom et
# n'annule pas la vérification d'une poussée sur main.
concurrency:
  group: verif-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1
  REFERENCE_VERIF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par empreinte : une étiquette peut être déplacée, pas une empreinte.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REFERENCE_VERIF }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La construction exporte le guide du relais (PDF et images) : elle a besoin du navigateur de Playwright.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Format, lint, couleurs, types, tests, construction, poids
        run: pnpm verif:ci
        env:
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP }}

      - name: Vérifier la couverture des deux lots
        run: node outils/verification-ci.ts partitions

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-parcours
          path: dist/
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  parcours:
    name: Parcours ${{ matrix.partition }}/2
    needs: verif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REFERENCE_VERIF }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-parcours
          path: dist/
      - name: Parcours sur le site déjà construit
        run: pnpm test:parcours:exec --shard=${{ matrix.partition }}/2
        env:
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rapport-parcours-${{ matrix.partition }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  # Les droits et les règles de la base (tests pgTAP), sur une base Supabase jetable.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REFERENCE_VERIF }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Base locale (Postgres, connexion, stockage)
        run: pnpm exec supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Tests pgTAP
        run: pnpm base:tests

  validation:
    name: Validation complète
    if: always()
    needs: [verif, parcours, base]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REFERENCE_VERIF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Attester seulement les contrôles tous réussis du commit exact
        run: node outils/verification-ci.ts attester
        env:
          RESULTAT_VERIF: ${{ needs.verif.result }}
          RESULTAT_PARCOURS: ${{ needs.parcours.result }}
          RESULTAT_BASE: ${{ needs.base.result }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-complete
          path: verification.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
