name: Vérification

on:
  pull_request:
  push:
    branches: [main]
  # Rappelé par la mise en ligne : rien ne part en ligne sans ces contrôles.
  workflow_call:

permissions:
  contents: read

# `github.workflow` : appelé par la mise en ligne, ce groupe porte son nom et
# n'annule pas la vérification d'une poussée sur main.
concurrency:
  group: verif-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par empreinte : une étiquette peut être déplacée, pas une empreinte.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint, couleurs, types, tests, construction, poids
        run: pnpm verif
        env:
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP }}

      - name: Parcours dans un téléphone (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:parcours
        env:
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  # Les droits et les règles de la base (tests pgTAP), sur une base Supabase jetable.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Base locale (Postgres, connexion, stockage)
        run: pnpm exec supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Tests pgTAP
        run: pnpm base:tests
