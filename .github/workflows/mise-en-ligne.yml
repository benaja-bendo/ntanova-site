name: Mise en ligne

# Rien ne part en ligne sans que tous les tests passent :
#   1. les contrôles d'une pull request (verif.yml : format, lint, types, tests
#      unitaires, parcours Playwright, tests de la base) ;
#   2. une seule construction, envoyée telle quelle sur essai.ntanova.com ;
#   3. les contrôles en ligne sur essai (tests/en-ligne/) ;
#   4. seulement alors, la même construction sur ntanova.com, puis ses contrôles en ligne.
# La production ne part que de `main` ; le site d'essai peut recevoir une branche,
# pour essayer une pull request sur un téléphone avant de la fusionner.
#
# La première semaine, pas de bouton dans l'administration : une mise en ligne
# chaque nuit (elle relit la base, ce qui la garde éveillée), et un lancement à la
# main depuis l'onglet Actions de GitHub.
#
# La nuit met toujours à jour essai ; elle n'envoie la production que si la variable
# GitHub NUIT_VERS_PRODUCTION vaut « oui » (Settings, Secrets and variables, Actions,
# Variables). Absente ou autre chose : essai seulement. Un lancement à la main garde
# son sens : `cible` dit où aller, sans dépendre de la variable.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Où mettre en ligne
        type: choice
        options: [essai, production, les deux]
        default: essai
  schedule:
    # 1 h UTC, 2 h à Pointe-Noire.
    - cron: '0 1 * * *'

permissions:
  contents: read

# Une mise en ligne à la fois ; celle qui attend n'annule pas celle qui tourne.
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  controles:
    name: Contrôles
    uses: ./.github/workflows/verif.yml

  construction:
    name: Construction
    needs: controles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # La construction exporte le guide du relais (PDF et images) : elle a besoin du navigateur de Playwright.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Construction avec les valeurs publiques du dépôt
        run: pnpm build && pnpm poids
        env:
          # Jamais un guide en ligne dont la carte de passage porte « [numéro WhatsApp] ».
          GUIDE_NUMERO_OBLIGATOIRE: 'oui'
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_RESPONSABLE: ${{ vars.PUBLIC_RESPONSABLE }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7

  essai:
    name: Essai (essai.ntanova.com)
    needs: construction
    if: github.event_name == 'schedule' || inputs.cible != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/
      - name: Envoi chez Cloudflare
        run: pnpm exec wrangler deploy --env essai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Contrôles en ligne
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:en-ligne
        env:
          ADRESSE: https://essai.ntanova.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-essai
          path: playwright-report/
          retention-days: 7

  production:
    name: Production (ntanova.com)
    needs: [construction, essai]
    # Seulement depuis main, et seulement si le site d'essai a passé ses contrôles
    # (ou n'était pas demandé).
    if: >-
      always()
      && needs.construction.result == 'success'
      && (needs.essai.result == 'success' || needs.essai.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && ((github.event_name == 'schedule' && vars.NUIT_VERS_PRODUCTION == 'oui')
          || (github.event_name == 'workflow_dispatch' && inputs.cible != 'essai'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/
      - name: Envoi chez Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Contrôles en ligne
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:en-ligne
        env:
          ADRESSE: https://ntanova.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-production
          path: playwright-report/
          retention-days: 7
